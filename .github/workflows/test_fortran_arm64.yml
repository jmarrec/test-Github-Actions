name: Test Fortran arm64 MCVE

on:
  push:
  workflow_dispatch:

env:
  MINGW_GFORTRAN: "/c/mingw64/bin/x86_64-w64-mingw32-gfortran.exe"

jobs:
  configure_and_build:
    name: "${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [x64, arm64]
        include:
        - name: x64
          os: windows-2022
          vs-generator: x64
        - name: arm64
          os: windows-11-arm
          vs-generator: ARM64

    steps:
    - uses: actions/checkout@v7

    - name: Check msys64 mingw64 gfortran
      shell: bash
      run: |
        set -x
        echo "Trying in /c/msys64/mingw64/bin"
        ls -la /c/msys64/mingw64/bin/ | grep -i fortran || echo "NOT FOUND"
        /c/msys64/mingw64/bin/x86_64-w64-mingw32-gfortran.exe --version || echo "FAILED TO RUN"
        echo "Trying in /c/mingw64"
        ls -la /c/mingw64/bin/ | grep -i fortran || echo "NOT FOUND"
        /c/mingw64/bin/x86_64-w64-mingw32-gfortran.exe --version || echo "FAILED TO RUN"
        /c/mingw64/bin/x86_64-w64-mingw32-gfortran.exe -v || echo "FAILED TO RUN"

    - name: Create Build Directory
      run: cmake -E make_directory ./build/

    - name: Configure CMake
      working-directory: ./build
      shell: bash
      timeout-minutes: 4
      run: |
        cmake --debug-output -G "Visual Studio 17 2022" -A ${{ matrix.vs-generator }} -DMINGW_GFORTRAN=${{ env.MINGW_GFORTRAN }} ../fortran_mcve

    - name: Retry devenv.com repeatedly with a timeout
      if: always()
      shell: pwsh
      run: |
        $vfDir = Get-ChildItem -Path "build/CMakeFiles/CheckFortran/CMakeFiles" -Directory -ErrorAction SilentlyContinue |
          ForEach-Object { Join-Path $_.FullName "CompilerIdFortran" } |
          Where-Object { Test-Path $_ } |
          Select-Object -First 1

        if (-not $vfDir) {
          Write-Host "CompilerIdFortran directory not found, skipping"
          exit 0
        }

        Write-Host "Using directory: $vfDir"
        Set-Location $vfDir

        $devenv = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/Common7/IDE/devenv.com"

        for ($i = 1; $i -le 10; $i++) {
          Write-Host "=== Attempt $i ==="
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $devenv `
            -ArgumentList "CompilerIdFortran.vfproj", "/build", "Debug" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "attempt_$i.out.log" `
            -RedirectStandardError "attempt_$i.err.log"

          if (-not $proc.WaitForExit(60000)) {
            Write-Host "Attempt $i TIMED OUT after $($sw.Elapsed) - killing process $($proc.Id)"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "Attempt $i finished after $($sw.Elapsed) with exit code $($proc.ExitCode)"
          }

          Write-Host "--- stdout ---"
          Get-Content "attempt_$i.out.log" -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"
          Get-Content "attempt_$i.err.log" -ErrorAction SilentlyContinue
        }

    - name: Upload CompilerIdFortran artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: CompilerIdFortran-${{ matrix.name }}
        path: build/CMakeFiles/CheckFortran/CMakeFiles/*/CompilerIdFortran/
        if-no-files-found: warn

    - name: Build
      working-directory: ./build
      shell: bash
      run: cmake --build . --config Release
