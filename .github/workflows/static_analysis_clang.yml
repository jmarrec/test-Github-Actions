name: EnergyPlus Static Analysis

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ref, branch, tag, or SHA to check out'
        required: false
        default: 'develop'
      pr_number:
        description: 'Number of the pull request to label "Staged" (removed again if the run fails)'
        required: false
        default: ''

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  check:
    name: Check ${{ inputs.ref }}
    runs-on: ubuntu-24.04
    steps:
    # workflow_dispatch runs aren't attached to the PR, so create the check run ourselves
    # (with the workflow's own GITHUB_TOKEN) against the commit being checked.
    - name: Create check run
      id: create_check
      env:
        GITHUB_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ inputs.ref }}
      run: |
        started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
        check_run_id=$(gh api "repos/${{ github.repository }}/check-runs" \
          -f name="EnergyPlus Static Analysis" \
          -f head_sha="$HEAD_SHA" \
          -f status=in_progress \
          -f started_at="$started_at" \
          -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --jq .id)
        echo "check_run_id=$check_run_id" >> "$GITHUB_OUTPUT"

    - name: Add the Staged label
      if: inputs.pr_number != ''
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
          -f 'labels[]=Staged'

    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - name: Run energyplus-* clang-tidy checks
      id: clang_tidy_checks
      continue-on-error: true
      run: |
        echo "Mimic Success"
        exit 0

    - name: Run find_unused_members
      id: find_unused_members
      continue-on-error: true
      run: |
       echo "Mimic Failure"
       exit 1

    - name: Fail if any check found something
      if: |
        steps.clang_tidy_checks.outcome == 'failure' ||
        steps.find_unused_members.outcome == 'failure'
      run: |
        echo "One or more checks reported findings; see the failed steps above."
        exit 1

    - name: Report check run result
      if: always() && steps.create_check.outputs.check_run_id != ''
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CHECK_RUN_ID: ${{ steps.create_check.outputs.check_run_id }}
        CLANG_TIDY_OUTCOME: ${{ steps.clang_tidy_checks.outcome }}
        FIND_UNUSED_MEMBERS_OUTCOME: ${{ steps.find_unused_members.outcome }}
        STARTED_AT: ${{ steps.create_check.outputs.started_at }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        conclusion=success
        if [ "${{ job.status }}" != "success" ]; then
          conclusion=failure
        fi

        summary="- energyplus-* clang-tidy checks: ${CLANG_TIDY_OUTCOME}\n- find_unused_members: ${FIND_UNUSED_MEMBERS_OUTCOME}"

        # TODO: replace this dummy annotation with real clang-tidy findings, parsed
        # into one {path, start_line, end_line, annotation_level, message} object per finding.
        payload=$(jq -n \
          --arg status "completed" \
          --arg conclusion "$conclusion" \
          --arg started_at "$STARTED_AT" \
          --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg title "EnergyPlus Static Analysis" \
          --arg summary "$(printf '%b' "$summary")" \
          '{
            status: $status,
            conclusion: $conclusion,
            started_at: $started_at,
            completed_at: $completed_at,
            output: {
              title: $title,
              summary: $summary,
              annotations: [
                {
                  path: "main.cpp",
                  start_line: 1,
                  end_line: 1,
                  annotation_level: "warning",
                  title: "Dummy annotation",
                  message: "This is a placeholder annotation to be replaced with real clang-tidy findings."
                }
              ]
            }
          }')

        gh api "repos/${{ github.repository }}/check-runs/${CHECK_RUN_ID}" \
          --method PATCH \
          --input - <<< "$payload"

        # A failed run un-stages the PR so that "Staged" only stays on PRs that passed.
        if [ "$conclusion" = "failure" ] && [ -n "$PR_NUMBER" ]; then
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/Staged" \
            --method DELETE || echo "Could not remove the Staged label (already gone?)"
        fi
